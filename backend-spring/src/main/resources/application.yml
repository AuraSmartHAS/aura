spring:
  application:
    name: aura-api
  config:
    import: classpath:scoring-weights.yml
  profiles:
    active: dev
  # Uma pasta de migrations por banco. {vendor} vira postgresql ou oracle conforme o driver: o SQL
  # dos dois nao e intercambiavel, e o Flyway le subpastas, entao com o local padrao
  # (db/migration) as migrations do Oracle vazariam para o Postgres e vice-versa.
  flyway:
    locations: classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

aura:
  jwt:
    # Em produção vem de AURA_JWT_SECRET; o default só existe para a demo local.
    secret: ${AURA_JWT_SECRET:aura-care-chain-fiap-2026-smart-has-chave-de-demonstracao-hs256}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  scoring:
    window-days: 14
    config-version: "2026-06-14"
    levels:
      medium: 0.4
      high: 0.7
  carechain:
    delivery-sla-hours: 24
    install-sla-hours: 72
    # Janela simulada da última milha (saída da loja → porta da casa). É dela que nasce a ETA
    # de "em rota" e a posição do entregador; em produção viria do roteirizador do parceiro.
    route-window-minutes: 20
    # Instalação cobrada à parte: a tela soma item + instalação antes de a cuidadora aprovar.
    installation-included: false
    installation-price: 149.90
    replenish:
      # Régua da reposição por consumo (v1 explicável — média simples, sem modelo preditivo).
      window-days: 21        # janela do burn rate
      safety-stock-days: 4   # margem além do lead time, versionada como os pesos do escore
      min-history-days: 7    # sem uma semana de confirmações, nada se projeta
      package-doses: 30      # doses que uma reposição entrega
      snooze-hours: 24       # "deixar para depois" cala a sugestão por este prazo (ou até a entrega)
  cors:
    # Padroes, nao origens literais: com credenciais habilitadas o Spring recusa curinga em
    # setAllowedOrigins, entao SecurityConfig usa setAllowedOriginPatterns. A faixa cobre o
    # notebook e os Androids na mesma rede local do ensaio; nao ha origem publica.
    allowed-origins: ${AURA_CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*,http://192.168.*.*:*,http://10.*.*.*:*,http://172.16.*.*:*}
  sos:
    # Fluxo de crise (C3). A contagem de cancelamento mora AQUI, no servidor, nunca no aparelho:
    # cronômetro de cliente morre quando o telefone cai da mão — que é exatamente o cenário.
    cancel-window-seconds: 5
    # Sem "estou indo" nesse tempo, o aviso vai para os demais membros da casa.
    escalate-after-seconds: 60
    # Contenção de abuso do endpoint aberto: toque repetido dentro dessa janela devolve a mesma
    # emergência em vez de criar outra. Também é o que impede o toque duplo acidental de virar dois.
    min-interval-seconds: 30
    # Teto por casa/hora, só para disparo SEM sessão. Acima dele o registro é gravado e o push contido.
    max-per-hour: 12
    # Varredor de recuperação: pega disparo vencido que o agendamento em memória perdeu num restart.
    sweep-millis: 1000
  voice:
    # Agente de voz da Maria (ElevenLabs). Só o NOME das variáveis mora aqui; sem elas o endpoint
    # /voice/token responde 503 VOICE_NOT_CONFIGURED e o resto da API segue normal.
    api-key: ${ELEVENLABS_API_KEY:}
    agent-id: ${ELEVENLABS_AGENT_ID:}
    base-url: https://api.elevenlabs.io
  push:
    # Credencial do Firebase — só o NOME da variável mora aqui; o segredo nunca entra no repositório.
    # Uma das duas basta: caminho do arquivo da conta de serviço ou o JSON inteiro.
    # Vazias nas duas (o padrão do CI e do desenvolvimento) = push simulado, sem derrubar nada.
    credentials-path: ${AURA_FIREBASE_CREDENTIALS:}
    credentials-json: ${AURA_FIREBASE_CREDENTIALS_JSON:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:aura;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
  # Nao existe db/migration/h2: as migrations sao SQL de cada banco real. Aqui o schema continua
  # nascendo do Hibernate a cada boot, que e o que mantem a suite rapida.
  flyway:
    enabled: false

aura:
  seed:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${AURA_DB_URL:jdbc:postgresql://localhost:5432/aura}
    username: ${AURA_DB_USER:aura}
    # Sem default: a aplicacao recusa subir sem AURA_DB_PASSWORD em vez de aceitar senha fraca
    # num banco que agora e persistente e escuta na rede local.
    password: ${AURA_DB_PASSWORD}
  jpa:
    hibernate:
      # validate, nao update: o schema vem do Flyway. Se V1__baseline.sql divergir das entidades
      # o boot falha aqui, em vez de o banco derivar em silencio entre um ensaio e outro.
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  # Explicito e intencional: os Androids do ensaio alcancam a API pelo IP do notebook na rede
  # local. Nao e omissao herdada do default do Tomcat. Use 127.0.0.1 para fechar a porta.
  address: ${AURA_BIND_ADDRESS:0.0.0.0}

aura:
  seed:
    enabled: ${AURA_SEED:false}

---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    # FREEPDB1 é o banco plugável do Oracle Free (docker-compose.oracle.yml). No servidor da FIAP
    # a URL e o usuário (RM) vêm por variável de ambiente.
    url: ${AURA_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${AURA_DB_USER:aura}
    # Sem default, pelo mesmo motivo do perfil postgres.
    password: ${AURA_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      # O schema e o PL/SQL vêm de db/migration/oracle; o Hibernate só confere.
      ddl-auto: validate
  flyway:
    enabled: true
    # false, ao contrário do postgres: num schema que já tem tabelas (o usuário RM da FIAP costuma
    # ter as de outras disciplinas) o baseline marcaria a V1 como aplicada e pularia o esquema
    # inteiro. Aqui o Flyway exige schema vazio e falha alto se não estiver.
    baseline-on-migrate: false
    # O Flyway trocaria qualquer "${" por placeholder; desligado para que o texto das procedures
    # chegue ao banco exatamente como está no arquivo.
    placeholder-replacement: false

server:
  address: ${AURA_BIND_ADDRESS:0.0.0.0}

aura:
  seed:
    enabled: ${AURA_SEED:false}
