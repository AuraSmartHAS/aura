spring:
  application:
    name: aura-api
  config:
    import: classpath:scoring-weights.yml
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate.format_sql: false
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-message: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  api-docs:
    path: /v3/api-docs

aura:
  jwt:
    # Em produção vem de AURA_JWT_SECRET; o default só existe para a demo local.
    secret: ${AURA_JWT_SECRET:aura-care-chain-fiap-2026-smart-has-chave-de-demonstracao-hs256}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  scoring:
    window-days: 14
    config-version: "2026-06-14"
    levels:
      medium: 0.4
      high: 0.7
  carechain:
    delivery-sla-hours: 24
    install-sla-hours: 72
    # Janela simulada da última milha (saída da loja → porta da casa). É dela que nasce a ETA
    # de "em rota" e a posição do entregador; em produção viria do roteirizador do parceiro.
    route-window-minutes: 20
    # Instalação cobrada à parte: a tela soma item + instalação antes de a cuidadora aprovar.
    installation-included: false
    installation-price: 149.90
  cors:
    allowed-origins: "*"
  sos:
    # Fluxo de crise (C3). A contagem de cancelamento mora AQUI, no servidor, nunca no aparelho:
    # cronômetro de cliente morre quando o telefone cai da mão — que é exatamente o cenário.
    cancel-window-seconds: 5
    # Sem "estou indo" nesse tempo, o aviso vai para os demais membros da casa.
    escalate-after-seconds: 60
    # Contenção de abuso do endpoint aberto: toque repetido dentro dessa janela devolve a mesma
    # emergência em vez de criar outra. Também é o que impede o toque duplo acidental de virar dois.
    min-interval-seconds: 30
    # Teto por casa/hora, só para disparo SEM sessão. Acima dele o registro é gravado e o push contido.
    max-per-hour: 12
    # Varredor de recuperação: pega disparo vencido que o agendamento em memória perdeu num restart.
    sweep-millis: 1000
  push:
    # Credencial do Firebase — só o NOME da variável mora aqui; o segredo nunca entra no repositório.
    # Uma das duas basta: caminho do arquivo da conta de serviço ou o JSON inteiro.
    # Vazias nas duas (o padrão do CI e do desenvolvimento) = push simulado, sem derrubar nada.
    credentials-path: ${AURA_FIREBASE_CREDENTIALS:}
    credentials-json: ${AURA_FIREBASE_CREDENTIALS_JSON:}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:aura;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop

aura:
  seed:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${AURA_DB_URL:jdbc:postgresql://localhost:5432/aura}
    username: ${AURA_DB_USER:aura}
    password: ${AURA_DB_PASSWORD:aura}
  jpa:
    hibernate:
      ddl-auto: update

aura:
  seed:
    enabled: ${AURA_SEED:false}
