# Postgres para rodar a API no perfil `postgres`:
#   docker compose up -d
#   export AURA_DB_PASSWORD=...   # obrigatorio, sem default
#   AURA_SEED=true ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# O cenário padrão da demo (H2 em memória) não precisa deste arquivo.
services:
  db:
    image: postgres:16-alpine
    container_name: aura-postgres
    environment:
      POSTGRES_DB: aura
      POSTGRES_USER: aura
      POSTGRES_PASSWORD: ${AURA_DB_PASSWORD:?defina AURA_DB_PASSWORD}
    ports:
      # Loopback apenas. O que precisa estar na rede local e a API na 8080, nao o banco.
      - "127.0.0.1:5432:5432"
    volumes:
      - aura-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aura"]
      interval: 5s
      retries: 10

volumes:
  aura-pgdata:
