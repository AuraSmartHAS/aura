# CI do monorepo AURA — roda só o que mudou, em paralelo. Nenhum segredo necessário.
#
# Escopo desta primeira versão (deliberado): os quatro projetos rodam os testes que
# JÁ existem. Os gates mais duros do plano (lint de design system, verificação de
# contrato openapi ↔ types.gen.ts, e2e do painel) entram quando os scripts existirem
# — ver "PRÓXIMOS PASSOS" no fim do arquivo.
# Regra da casa: CI que nasce vermelho é CI que todo mundo aprende a ignorar.
#
# Cada job foi executado localmente antes de entrar, para o workflow não nascer vermelho
# por surpresa. As contagens de teste moram no README, não aqui: número em comentário
# de CI é o primeiro a ficar velho.
name: CI

on:
  pull_request:
  push:
    branches: [main, astra-main, fase5, rn-total]
  # Varredura completa, sem filtro de caminho. Existe porque o filtro escondeu uma quebra:
  # o painel parou de compilar os testes num push à main, os pushes seguintes só tocaram
  # backend e docs, o job do painel foi pulado ("skipped" conta como verde) e a main ficou
  # verde com o painel quebrado por semanas. A varredura semanal pega esse caso.
  schedule:
    - cron: '0 9 * * 1' # segunda, 06h em São Paulo
  workflow_dispatch:

# PR novo cancela a run antiga do mesmo branch — economiza minutos do plano free.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Descobre o que mudou. Todos os outros jobs dependem daqui. ────────────────
  # Usamos dorny/paths-filter em vez do `paths:` nativo porque o nativo é um só
  # por arquivo: filtrar por projeto exigiria 4 workflows e 4 branch protections.
  mudou:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filtro.outputs.backend }}
      rn: ${{ steps.filtro.outputs.rn }}
      admin: ${{ steps.filtro.outputs.admin }}
      flutter: ${{ steps.filtro.outputs.flutter }}
      oracle: ${{ steps.filtro.outputs.oracle }}
      # Fora de push e PR (varredura semanal ou disparo manual) tudo roda.
      tudo: ${{ github.event_name != 'push' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        # Em varredura/disparo manual não há diff a comparar; o output `tudo` cobre esse caso.
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            backend:
              - 'backend-spring/**'
              - '.github/workflows/ci.yml'
            rn:
              - 'mobile-rn/**'
              - '.github/workflows/ci.yml'
            admin:
              - 'web-admin/**'
              - '.github/workflows/ci.yml'
            flutter:
              - 'mobile/**'
              - '.github/workflows/ci.yml'
            oracle:
              - 'backend-spring/src/main/resources/db/migration/oracle/**'
              - 'backend-spring/src/main/java/br/com/fiap/aura/intelligence/**'
              # Entidade nova ou coluna mudada quebra o validate do Hibernate no Oracle.
              - 'backend-spring/src/main/java/br/com/fiap/aura/domain/**'
              - 'backend-spring/src/main/resources/application.yml'
              - 'backend-spring/src/test/java/br/com/fiap/aura/infra/**'
              - 'backend-spring/src/test/java/br/com/fiap/aura/web/*OracleTest.java'
              - 'backend-spring/pom.xml'
              - 'database/oracle/**'
              - '.github/workflows/ci.yml'

  # ── Spring: suíte rápida em H2 (perfil dev), sem Postgres, sem Docker. ──────
  backend-spring:
    needs: mudou
    if: needs.mudou.outputs.backend == 'true' || needs.mudou.outputs.tudo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # pom.xml: <java.version>21</java.version>
          cache: maven
      # O wrapper é distributionType=only-script: baixa o Maven na primeira run.
      - name: Testes
        working-directory: backend-spring
        run: ./mvnw -B -ntp test

  # ── Spring sobre Oracle (Fase 6): schema, PL/SQL e REST → Java → JDBC → Oracle.
  # Sobe um Oracle Free de verdade por Testcontainers (Docker já vem no runner). Fica num
  # job próprio, só quando algo do Oracle muda, porque a imagem pesa ~1,3 GB por run.
  backend-oracle:
    needs: mudou
    if: needs.mudou.outputs.oracle == 'true' || needs.mudou.outputs.tudo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testes contra Oracle (tag oracle)
        working-directory: backend-spring
        run: ./mvnw -B -ntp test -Dtest.groups=oracle -Dtest.excludedGroups=

  # ── App React Native: destino da migração. Tipos primeiro, testes depois. ────
  mobile-rn:
    needs: mudou
    if: needs.mudou.outputs.rn == 'true' || needs.mudou.outputs.tudo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile-rn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # Expo SDK 57 / RN 0.86
          cache: npm
          cache-dependency-path: mobile-rn/package-lock.json
      # npm ci (não install): instala exatamente o lock. É o que revela dependência
      # instalada na máquina de alguém e nunca declarada no package.json.
      - run: npm ci
      - name: Tipos (TypeScript strict)
        run: npm run typecheck
      - name: Testes
        run: npm test -- --ci --maxWorkers=2

  # ── Painel Angular: build de produção pega erro de template que o teste não vê.
  web-admin:
    needs: mudou
    if: needs.mudou.outputs.admin == 'true' || needs.mudou.outputs.tudo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-admin/package-lock.json
      - run: npm ci
      - run: npx ng build --configuration production
      # Chrome já vem no runner ubuntu-latest. Sem --no-watch o Karma trava para sempre.
      - name: Testes unitários (headless)
        run: npx ng test --no-watch --no-progress --browsers=ChromeHeadless

  # ── Flutter: é o app que sobe ao palco até o RN atingir paridade. ────────────
  mobile:
    needs: mudou
    if: needs.mudou.outputs.flutter == 'true' || needs.mudou.outputs.tudo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # O pubspec declara `.env` como asset e o .gitignore o esconde: sem esta
      # linha, build e teste falham por asset faltando em clone limpo.
      - name: Prepara o .env a partir do exemplo
        run: cp .env.example .env
      - run: flutter pub get
      # Rodado localmente em 27/08 com Flutter 3.47.1: "No issues found!".
      # Justamente por isso entra bloqueante — não há dívida a tolerar aqui, e
      # gate tolerante em código que já está limpo só ensina o time a ignorar CI.
      - name: Análise estática
        run: flutter analyze
      - run: flutter test

  # ── Agregador: é este que a branch protection exige. ─────────────────────────
  # Sem ele, um job que não rodou (porque o filtro não pegou) aparece como
  # pendente para sempre e a proteção de branch nunca libera o merge.
  ci:
    if: always()
    needs: [backend-spring, backend-oracle, mobile-rn, web-admin, mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado
        run: |
          echo "backend-spring: ${{ needs.backend-spring.result }}"
          echo "backend-oracle: ${{ needs.backend-oracle.result }}"
          echo "mobile-rn:      ${{ needs.mobile-rn.result }}"
          echo "web-admin:      ${{ needs.web-admin.result }}"
          echo "mobile:         ${{ needs.mobile.result }}"
          # 'skipped' é sucesso: significa que aquele projeto não foi tocado no PR.
          for r in "${{ needs.backend-spring.result }}" "${{ needs.backend-oracle.result }}" \
                   "${{ needs.mobile-rn.result }}" \
                   "${{ needs.web-admin.result }}" "${{ needs.mobile.result }}"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::Pelo menos um projeto falhou."
              exit 1
            fi
          done
          echo "Tudo verde (ou não tocado)."

# ── PRÓXIMOS PASSOS (não improvisar: cada um tem o desenho pronto no plano) ────
# 1. Lint do design system — nenhum hex fora de core/theme, nenhum import cruzado
#    entre features, fontSize com piso, nada de fetch em tela.
#    Config de ESLint pronta em "PLANO RN TOTAL/10-QUALIDADE-TESTES-E-CI.md" §4.
#    Hoje NÃO existe ESLint em nenhum lugar do monorepo — por isso ficou fora daqui.
# 2. Job de contrato (duas pernas): docs/api/openapi.json vs o Spring vivo, e
#    types.gen.ts vs openapi.json. Desenho em §5 do mesmo documento. Entra quando
#    a geração de tipos existir no mobile-rn.
# 3. e2e do painel (Playwright): sobe 2 servidores e depende de JAVA_HOME;
#    é caro para rodar em todo PR. Sugestão do plano: agendado ou por label.
